# Cloudflare Pages 설정 — 화면(dist) + Pages Functions(functions/) + D1 + R2
name = "wow3d-toybook"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "toybook-db"
# 운영 D1 (APAC). 로컬 실행은 .wrangler/ 의 흉내 DB 를 쓰므로 영향 없음
database_id = "9444985d-45df-4aa1-ae33-869615b982f2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "toybook-files"
