<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDFB" />
      <stop offset="100%" stop-color="#F6F0FD" />
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6FDC" />
      <stop offset="100%" stop-color="#6D50C9" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE380" />
      <stop offset="100%" stop-color="#FFC94D" />
    </linearGradient>
    <filter id="cardDrop" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6C52B4" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Horizontal Header Card Background -->
  <rect width="920" height="360" rx="44" fill="url(#bgGrad3)" stroke="#ECE5FD" stroke-width="4" />

  <!-- Left App Icon / Mascot Tile (Ready for App Header & Favicon) -->
  <g transform="translate(64, 66)" filter="url(#cardDrop)">
    <rect x="0" y="0" width="228" height="228" rx="56" fill="url(#iconBg)" />
    <!-- Soft inner highlight -->
    <rect x="10" y="10" width="208" height="208" rx="48" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.25" />

    <!-- Open Storybook Wings inside Icon -->
    <path d="M36 122 C66 106, 94 110, 114 128 L114 192 C94 176, 66 172, 36 186 Z" fill="#FFFDFB" />
    <path d="M192 122 C162 106, 134 110, 114 128 L114 192 C134 176, 162 172, 192 186 Z" fill="#FFC6B3" />
    <path d="M44 134 C68 122, 92 126, 108 140" stroke="#DDD0FB" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M184 134 C160 122, 136 126, 120 140" stroke="#FF9B7B" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- 3D Toy Character Head + Storyteller Hat -->
    <!-- Storyteller Cone Hat (Mint) -->
    <path d="M114 22 L144 68 L84 68 Z" fill="#DEF4EA" />
    <circle cx="114" cy="22" r="7" fill="#FFC94D" />
    <!-- Character Round Face -->
    <circle cx="114" cy="92" r="34" fill="url(#starGrad)" />
    <!-- Eyes & Happy Smile -->
    <circle cx="101" cy="88" r="4.8" fill="#2B2850" />
    <circle cx="127" cy="88" r="4.8" fill="#2B2850" />
    <ellipse cx="92" cy="96" rx="5.5" ry="3.5" fill="#FF8B7B" opacity="0.7" />
    <ellipse cx="136" cy="96" rx="5.5" ry="3.5" fill="#FF8B7B" opacity="0.7" />
    <path d="M106 97 Q114 105 122 97" stroke="#2B2850" stroke-width="3.2" stroke-linecap="round" fill="none" />

    <!-- "3D" Pill Tag on Corner -->
    <rect x="156" y="24" width="48" height="28" rx="14" fill="#FFC94D" />
    <text x="180" y="43" text-anchor="middle" font-family="'Jua', 'Pretendard Variable', sans-serif" font-size="16" font-weight="800" fill="#2B2850">3D</text>
  </g>

  <!-- Right Horizontal Wordmark Lockup -->
  <g transform="translate(332, 0)">
    <!-- Top Pill Tag -->
    <rect x="0" y="78" width="242" height="36" rx="18" fill="#FFE7DD" />
    <text x="121" y="102" text-anchor="middle" font-family="'Pretendard Variable', 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" fill="#D65A38">
      ✨ AI 동화책 &amp; 3D 캐릭터 토이
    </text>

    <!-- Primary English Wordmark: wow3d-Toybook -->
    <text x="0" y="188" font-family="'Jua', 'Pretendard Variable', 'Malgun Gothic', sans-serif" font-size="68" font-weight="800" letter-spacing="-1">
      <tspan fill="#8B6FDC">wow3d</tspan><tspan fill="#FF9E7D">-</tspan><tspan fill="#2B2850">Toybook</tspan>
    </text>

    <!-- Primary Korean Wordmark: 와우쓰리디- 토이북 -->
    <text x="4" y="254" font-family="'Jua', 'Pretendard Variable', 'Malgun Gothic', sans-serif" font-size="44" font-weight="700" letter-spacing="0.5">
      <tspan fill="#6D50C9">와우쓰리디</tspan><tspan fill="#FF9E7D">- </tspan><tspan fill="#2B2850">토이북</tspan>
    </text>

    <!-- Decorative Color Dots (Design System Swatches) -->
    <circle cx="445" cy="240" r="9" fill="#8B6FDC" />
    <circle cx="471" cy="240" r="9" fill="#FFC6B3" />
    <circle cx="497" cy="240" r="9" fill="#FFC94D" />
    <circle cx="523" cy="240" r="9" fill="#DEF4EA" />
  </g>
</svg>

